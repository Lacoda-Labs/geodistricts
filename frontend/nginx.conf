events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;

    server {
        listen 8080;
        # Accept any Host (Cloud Run / custom domain); avoid localhost-only redirects
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Behind HTTPS load balancers the connection to nginx is HTTP on 8080. Without these,
        # some redirects use http://host:8080/... and browsers block them as mixed content
        # when the page was loaded over HTTPS.
        absolute_redirect off;
        port_in_redirect off;

        # Route /maps matches Angular path AND a real static directory maps/ (bundled JSON).
        # Exact /maps and /maps/ must serve the SPA, not directory listing (403 with autoindex off).
        location = /maps {
            try_files /index.html =404;
        }
        location = /maps/ {
            try_files /index.html =404;
        }

        # Handle Angular routing ($uri/ omitted: /foo/ would hit a real dir maps/ and 403)
        location / {
            try_files $uri /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
