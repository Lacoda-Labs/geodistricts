<div class="us-congressional-map" [class.hero-variant]="variant === 'hero'" [class.geodistricts-variant]="geodistrictStepDataByState?.length">
  <div class="map-container">
    <!-- Hero: raster fallback for instant load (transparent, light gray lines); dimmed after 3 loops -->
    <img
      *ngIf="variant === 'hero'"
      class="hero-raster"
      [class.hero-raster-dimmed]="variant === 'hero' && heroAnimationDone"
      src="assets/hero-conus-119.webp"
      alt=""
      width="800"
      height="500"
      fetchpriority="high" />
    <!-- Geodistricts mode (maps page All): paths with per-district fill and click -->
    <svg
      *ngIf="geodistrictStepDataByState?.length && pathDByDistrict.length"
      class="boundaries-svg"
      [attr.viewBox]="viewBox"
      preserveAspectRatio="xMidYMid meet"
      xmlns="http://www.w3.org/2000/svg">
      <g class="boundaries-layer">
        <path
          *ngFor="let p of pathDByDistrict"
          [attr.d]="p.d"
          [attr.fill]="getDistrictFill(p.stateCode, p.groupKey)"
          (click)="onDistrictClick(p.stateCode)"
          class="district-path geodistrict-path"/>
      </g>
    </svg>
    <!-- Default: all paths at once (congressional boundaries) -->
    <svg
      *ngIf="variant !== 'hero' && !geodistrictStepDataByState?.length && svgPathD.length"
      class="boundaries-svg"
      [attr.viewBox]="viewBox"
      preserveAspectRatio="xMidYMid meet"
      xmlns="http://www.w3.org/2000/svg">
      <g class="boundaries-layer">
        <path
          *ngFor="let d of svgPathD"
          [attr.d]="d"
          class="district-path"/>
      </g>
    </svg>
    <!-- Hero: YMin so map graphic aligns to top of SVG viewport (no gap above); hide when animation done (dimmed raster only) -->
    <svg
      *ngIf="variant === 'hero' && !heroAnimationDone && (heroAnimatedPaths.length || isLoading)"
      class="boundaries-svg"
      [attr.viewBox]="viewBox"
      preserveAspectRatio="xMidYMin meet"
      xmlns="http://www.w3.org/2000/svg">
      <g class="boundaries-layer">
        <path
          *ngFor="let p of heroAnimatedPaths"
          [attr.d]="p.d"
          class="district-path hero-path"
          [class.hero-path-filled]="p.filled"/>
      </g>
    </svg>
  </div>
  <div *ngIf="isLoading && variant !== 'hero' && !geodistrictStepDataByState?.length" class="loading-overlay">
    <div class="loading-spinner-container">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading district boundaries...</p>
    </div>
  </div>
  <div *ngIf="errorMessage" class="error-overlay">
    <p class="error-text">{{ errorMessage }}</p>
  </div>
</div>
